name: careosis_mr
description: "CareOsis MR - Enterprise Medical Representative Mobile Operating System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Routing & Navigation
  go_router: ^14.2.0

  # Local SQLite & Drift ORM
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Utilities & Helpers
  intl: ^0.20.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Device Hardware Abstractions
  geolocator: ^12.0.0
  image_picker: ^1.1.2

  # Supabase Cloud Backend
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0

  # Firebase Cloud Backend
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env

